# On a vX.Y.Z tag: check it matches package.json, type check, build plugin.zip (scripts/pack.sh also
# compiles it the way Nuclear does, to catch missing files) and publish a GitHub release with it.
# Nuclear compiles the TypeScript on install, so the zip ships package.json (whose "main" points to
# src/index.ts), the license and the src folder.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1
          fi

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build and check plugin.zip
        run: npm run pack

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin.zip --title "$GITHUB_REF_NAME" --generate-notes
