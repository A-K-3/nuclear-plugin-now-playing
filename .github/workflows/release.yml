# On a vX.Y.Z tag: check it matches package.json, compile the plugin the way Nuclear does
# (to catch errors) and publish a GitHub release with plugin.zip.
# Nuclear compiles the TypeScript on install, so the zip ships the source files at its root.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1
          fi

      - name: Compile (check)
        run: npx --yes esbuild@0.24.0 index.ts --bundle --format=cjs --platform=browser --external:react --outfile=/tmp/check.js

      - name: Build plugin.zip
        run: zip plugin.zip package.json LICENSE *.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin.zip --title "$GITHUB_REF_NAME" --generate-notes
