# Al subir una etiqueta vX.Y.Z: comprueba que coincide con package.json, compila el plugin
# como lo hace Nuclear (para detectar errores) y publica una release con plugin.zip.
# Nuclear compila el TypeScript al instalar, así que el zip lleva el código fuente en la raíz.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($pkg)"; exit 1
          fi

      - name: Compilar (comprobación)
        run: npx --yes esbuild@0.24.0 index.ts --bundle --format=cjs --platform=browser --external:react --outfile=/tmp/check.js

      - name: Crear plugin.zip
        run: zip plugin.zip package.json LICENSE *.ts

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin.zip --title "$GITHUB_REF_NAME" --generate-notes
