# On every pull request and push to main: type check, smoke tests, and a check that the release zip
# contains everything Nuclear needs to compile the plugin.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm test

      - name: Package check
        run: |
          zip -qr plugin.zip package.json LICENSE src
          mkdir /tmp/plugin && unzip -q plugin.zip -d /tmp/plugin
          entry=$(node -p "require('/tmp/plugin/package.json').main")
          npx esbuild "/tmp/plugin/$entry" --bundle --format=cjs --platform=browser \
            --external:react --external:@nuclearplayer/plugin-sdk --outfile=/tmp/check.js
